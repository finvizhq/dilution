[pytest]
# Run from the repo root. `pythonpath = .` puts the repo root on sys.path
# so the test modules can `import config`, `import db`, and
# `from dilution... import ...` exactly the way the production code does.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
filterwarnings =
    # yfinance / pandas / urllib emit deprecation noise that is not ours.
    ignore::DeprecationWarning
